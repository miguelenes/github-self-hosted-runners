# =============================================================================
# CodeQL Security Analysis
# =============================================================================
# Scans the codebase for security vulnerabilities and coding errors using
# GitHub's CodeQL analysis engine.
#
# Supported languages in this repo: shell scripts, Dockerfiles
# =============================================================================

name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to catch newly discovered vulnerabilities
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: shell

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:shell"
