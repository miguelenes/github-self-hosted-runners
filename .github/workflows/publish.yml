# =============================================================================
# Build & Publish — GitHub Actions Self-Hosted Runner Image
# =============================================================================
# Publishes a multi-arch (linux/amd64 + linux/arm64) Docker image to the
# GitHub Container Registry (ghcr.io) on every push to main and on semver tags.
#
# Pull requests trigger a build-only job (no push) to validate the Dockerfile.
#
# Image location: ghcr.io/<owner>/github-runner
# Authentication: GITHUB_TOKEN (built-in, no extra secrets required)
#
# Strategy: build each platform in its own job (avoids slow cross-arch QEMU
# emulation for both arches in a single job), then merge the per-arch digests
# into a single multi-arch manifest in the final 'merge' job.
# =============================================================================

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/tag to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository_owner }}/github-runner

jobs:
  # ── Job 1: Build one platform per matrix entry ──────────────────────────────
  # Each job builds a single platform and uploads the image digest as an
  # artifact. The 'merge' job below collects the digests and creates a
  # combined multi-arch manifest.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write   # Required for Cosign keyless signing (OIDC token)

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    outputs:
      image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. Multi-arch support ─────────────────────────────────────────────────
      # QEMU is only needed on the arm64 matrix entry; it's a no-op on amd64.
      - name: Set up QEMU (for ARM64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 3. Authenticate with GHCR ─────────────────────────────────────────────
      # Skipped on pull requests — we build but do not push for PRs.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Generate Complete OCI Metadata ─────────────────────────────────────
      # docker/metadata-action computes standardized OCI tags and labels from Git context
      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=GitHub Actions Self-Hosted Runner
            org.opencontainers.image.description=Ephemeral GitHub Actions runners on Docker Swarm
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}

      # ── 5. Build with Optimized GHA Cache ─────────────────────────────────────
      # Uses GitHub Actions native cache (type=gha) scoped per platform matrix
      # to prevent amd64 and arm64 layer cache thrashing.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms:    ${{ matrix.platform }}
          labels:       ${{ steps.meta.outputs.labels }}
          outputs:      >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=${{ github.event_name != 'pull_request' }}
          # Supply-chain attestations: SBOM (SPDX) + SLSA provenance
          sbom:         true
          provenance:   mode=max
          # Optimized GitHub Actions Cache with platform-scoped isolation
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to:   >-
            ${{ github.event_name != 'pull_request'
              && format('type=gha,mode=max,scope={0}', matrix.platform)
              || '' }}
          build-args: |
            RUNNER_VERSION=2.336.0

      # ── 6. Step Summary Output (Build Job) ───────────────────────────────────
      - name: Generate Step Summary (Build)
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🛠️ Build Completed (`${{ matrix.platform }}`)

          | Attribute | Value |
          |---|---|
          | **Platform** | `${{ matrix.platform }}` |
          | **Digest** | `${{ steps.build.outputs.digest }}` |
          | **Pushed** | `${{ github.event_name != 'pull_request' }}` |
          | **Cache Scope** | `type=gha,scope=${{ matrix.platform }}` |
          EOF

      # ── 7. Export digest for the merge job ───────────────────────────────────
      - name: Export image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare artifact name
        if: github.event_name != 'pull_request'
        id: artifact
        run: echo "name=digest-$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name:              ${{ steps.artifact.outputs.name }}
          path:              /tmp/digests/*
          if-no-files-found: error
          retention-days:    1

  # ── Job 2: Merge per-platform digests into one multi-arch manifest ───────────
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs:   build
    if:      github.event_name != 'pull_request'

    permissions:
      contents:  read
      packages:  write
      id-token:  write   # Required for Cosign OIDC signing

    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v8
        with:
          path:          /tmp/digests
          pattern:       digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Create a multi-arch manifest that references all per-platform digests.
      # Also captures the manifest digest for Cosign signing below.
      - name: Create and push multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          manifest_output=$(docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *))
          echo "${manifest_output}"
          # Extract the manifest digest (last line, sha256: prefix)
          digest=$(echo "${manifest_output}" | tail -1 | grep -oP 'sha256:[a-f0-9]+')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Inspect published manifest (also grabs the first tag for signing)
      - name: Inspect published manifest
        id: inspect
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=$(echo "${TAGS}" | head -1)
          docker buildx imagetools inspect "${first_tag}"
          echo "first_tag=${first_tag}" >> "$GITHUB_OUTPUT"

      # ── Cosign keyless signing ────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the published image with Cosign (keyless)
        run: |
          cosign sign --yes "${{ steps.inspect.outputs.first_tag }}@${{ steps.manifest.outputs.digest }}"

      # ── Workflow Summary Output (Merge Job) ──────────────────────────────────
      - name: Generate Workflow Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Multi-Arch Docker Image Published Successfully

          **Image Registry:** [`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`](https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})

          ### 📦 Published Tags
          EOF

          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### 🌐 Supported Architectures
          - `linux/amd64`
          - `linux/arm64`

          ### 🔑 Verification Command (Cosign)
          ```bash
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          ```

          ### ⚡ Deploy Command
          ```bash
          RUNNER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ./manage.sh deploy
          ```
          EOF
