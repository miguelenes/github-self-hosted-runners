# =============================================================================
# Stale Issue & PR Management
# =============================================================================
# Automatically marks inactive issues and pull requests as stale, then closes
# them after an additional period of inactivity.
#
# Rules:
#   - Issues:  stale after 60 days, closed after 14 more days
#   - PRs:     stale after 45 days, closed after 7 more days
#   - Issues/PRs with specific labels are exempt from staleness
# =============================================================================

name: "Stale Bot"

on:
  schedule:
    # Run daily at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # ── Issue settings ──────────────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            Feel free to comment or reopen if this is still relevant. Thank you for
            your contribution.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Please feel
            free to reopen if this is still relevant.
          exempt-issue-labels: "bug,security,enhancement,pinned"

          # ── PR settings ─────────────────────────────────────────────────────
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            Thank you for your contribution.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen or submit a new PR if this change is still needed.
          exempt-pr-labels: "dependencies,security,pinned"

          # ── General settings ────────────────────────────────────────────────
          ascending: true
          delete-branch: true
          operations-per-run: 30
