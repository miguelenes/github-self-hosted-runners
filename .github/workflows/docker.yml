name: Docker

run-name: "Docker · ${{ github.ref_name }} · ${{ github.sha }}"

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "docker/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# GHCR publish is optional. This stub is valid with no repository secrets.
# GITHUB_TOKEN is always present in Actions; it can push to GHCR when this
# workflow has `permissions: packages: write` and docker/login-action is enabled.
# No GHCR_USERNAME / GHCR_TOKEN (or other login secrets) are required.
# To publish:
#   1. Uncomment `packages: write` under permissions.
#   2. Uncomment the docker/login-action step (GITHUB_TOKEN is enough).
#   3. Set `push: true` on docker/build-push-action.
# To use a PAT instead of GITHUB_TOKEN, set repository secrets GHCR_USERNAME
# and GHCR_TOKEN and pass those to docker/login-action — never commit them.

permissions:
  contents: read
  # packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: github.actor
      #     password: GITHUB_TOKEN  # automatic; no extra repository secret

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ github.repository }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
