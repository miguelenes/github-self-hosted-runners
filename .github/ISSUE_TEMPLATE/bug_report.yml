name: Bug Report
description: File a bug report to help us fix issues with the self-hosted runner stack.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the details below.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Deploy stack with `RUNNER_EPHEMERAL=true`
        2. Trigger job ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Operating System, Docker version, Swarm topology, Runner image tag.
      placeholder: |
        - OS: Ubuntu 22.04 LTS
        - Docker version: 24.0.6
        - Swarm mode: Single node / Multi node
        - Image version: ghcr.io/...:latest
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Container / Service Logs
      description: Relevant output from `docker service logs runner_github-runner`.
      render: shell
